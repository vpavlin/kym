name: Release module LGX

# Build the portable KYM .lgx and publish it, then refresh the Basecamp package
# repo so `repo/index.json` on master points at the new release.
#   - push a tag `module-v*` -> build + attach the .lgx to a GitHub Release
#                               + regenerate & commit repo/index.json on master
#   - manual dispatch        -> build + upload the .lgx as a workflow artifact
#
# ALWAYS build .#lgx-portable (canonical variant names the package manager
# accepts), NEVER .#lgx. amd64 only for now (the module has no per-arch native
# deps today; add ubuntu-*-arm when arm64 Basecamp hosts are targeted).
#
# The mobile APK is NOT built here: it is signed locally (mobile-v* + release-apk.sh)
# because an Android signing key can't be rotated and must never touch CI.
on:
  push:
    tags: ["module-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Build KYM portable .lgx
        run: nix build ./module#lgx-portable -o lgx-out --print-out-paths

      - name: Collect artifact (arch-suffixed)
        run: |
          mkdir -p dist
          for f in lgx-out/*.lgx; do
            cp -L "$f" "dist/$(basename "$f" .lgx)-linux-amd64.lgx"
          done
          ls -la dist

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lgx-amd64
          path: dist/*.lgx
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/module-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.lgx
          fail_on_unmatched_files: true

      - name: Refresh Basecamp repo index on master
        if: startsWith(github.ref, 'refs/tags/module-v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bash scripts/gen-repo-index.sh "$TAG"
          cp repo/index.json /tmp/index.json
          git fetch origin master
          git checkout -B master origin/master
          cp /tmp/index.json repo/index.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo/index.json
          if git diff --cached --quiet; then
            echo "index unchanged"
          else
            git commit -m "ci: refresh Basecamp repo index for $TAG"
            git push origin master
          fi
